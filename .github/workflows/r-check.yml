name: R package checks

on:
  push:
    paths: ['r/**', '.github/workflows/r-check.yml']
  pull_request:
    paths: ['r/**', '.github/workflows/r-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/autoschemaR
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check native R package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck("r/autoschemaR", args = "--no-manual", error_on = "warning", check_dir = "r-check")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-${{ matrix.os }}
          path: r-check/
