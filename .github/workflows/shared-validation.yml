name: Shared dataset validation

on:
  push:
    paths:
      - 'src/**'
      - 'r/**'
      - 'scripts/shared_validation.*'
      - 'scripts/generate_shared_fixtures.py'
      - 'tests/test_shared_datasets.py'
      - '.github/workflows/shared-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'r/**'
      - 'scripts/shared_validation.*'
      - 'scripts/generate_shared_fixtures.py'
      - 'tests/test_shared_datasets.py'
      - '.github/workflows/shared-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/autoschemaR
      - run: R CMD INSTALL r/autoschemaR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python scripts/shared_validation.py --out validation-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-dataset-results
          path: validation-output/
