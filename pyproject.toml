[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoschema"
version = "0.2.0"
description = "CSV to inferred SQL tables with exact reconstruction and visual processing reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]

[project.scripts]
autoschema = "autoschema.cli:main"

[tool.setuptools.packages.find]
include = ["autoschema*"]
